<h1>helmoci</h1>
<p>Classic Helm chart repositories, served as an OCI registry.</p>
<p>Pull: <code>helm pull oci://&lt;this-host&gt;/&lt;repo-host&gt;/&lt;repo-path&gt;/&lt;chart&gt; --version &lt;version&gt;</code></p>
<p>List versions: <code>GET /v2/&lt;name&gt;/tags/list</code></p>
